version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    groups:
      testes:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk"]
    commit-message:
      prefix: "Dependências"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "CI"
