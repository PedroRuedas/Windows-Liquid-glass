name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, testes e formatação
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restaurar
        run: dotnet restore

      - name: Build (avisos são erros)
        run: dotnet build -c Release --no-restore

      - name: Testes
        run: dotnet test -c Release --no-build --logger "trx;LogFileName=resultados.trx" --results-directory TestResults

      - name: Formatação
        run: dotnet format --verify-no-changes --no-restore

      - name: Publicar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-dos-testes
          path: TestResults
          if-no-files-found: ignore
